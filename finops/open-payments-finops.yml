meters:
- name: consumer_egress
  description: Bandwidth the consumer uses to pull records and downloads from the API (consumer-side, no CMS charge).
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - dataset
- name: consumer_compute
  description: Compute the consumer spends ingesting and processing Open Payments data (consumer-side, no CMS charge).
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - workload
principles:
- name: Visibility
  description: Track consumer-side egress and compute for Open Payments ingestion; there is no provider invoice to reconcile.
- name: Allocation
  description: Tag ingestion jobs per program year and payment category so consumer-side costs map to internal workloads.
- name: Optimization
  description: Filter and select columns server-side, prefer bulk CSV/JSON download for whole-year extracts, and cache locally to avoid re-pulling static historical years.
- name: Accountability
  description: Assign owners to Open Payments ingestion pipelines and review their compute/storage footprint against budget.
