description: >-
  FinOps view of CMS Open Payments consumption. There is no vendor invoice - the
  API is a free, publicly funded U.S. government service with no usage charges,
  no metering, and no account. The only cost a consuming organization carries is
  its own side of the pipe: egress bandwidth to pull records, and the compute and
  storage to ingest, transform, and analyze them. Because single program years can
  contain tens of millions of rows, the dominant optimization lever is reducing
  how much data you move - filter server-side, select only the columns you need,
  and use bulk download for whole-year extracts rather than deep pagination.
notes: >-
  No provider-side spend exists to allocate. Track and optimize the consumer-side
  compute, storage, and network used to ingest and process Open Payments data. All
  costs sit in your own cloud or on-premise bill, not on a CMS invoice.
