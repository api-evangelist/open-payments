  name: Open Payments General Payments API
  tags:
  - Government Data
  - Healthcare
  - Payments
  - Transparency
  - General Payments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://openpaymentsdata.cms.gov/about/api
