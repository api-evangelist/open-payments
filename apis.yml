  - url: openapi/open-payments-openapi.yml
    type: OpenAPI
  - url: collections/open-payments.opencollection.json
    type: OpenCollection
  - url: collections/open-payments.postman_collection.json
    type: PostmanCollection
  description: >-
    Query general (non-research, non-ownership) payment records - payments and
    transfers of value from manufacturers and GPOs to covered recipients - via the
    DKAN datastore query endpoint, one distribution per program year. Supports
    filtering by recipient NPI, name, state, manufacturer, nature of payment, and
    amount, plus column selection, sorting, and pagination.
