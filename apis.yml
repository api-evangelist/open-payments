  - Open Data
  - Query
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://openpaymentsdata.cms.gov/about/api
  baseURL: https://openpaymentsdata.cms.gov/api/1
  properties:
  - url: https://openpaymentsdata.cms.gov/about/api
    type: Documentation
  - url: openapi/open-payments-openapi.yml
    type: OpenAPI
  - url: collections/open-payments.opencollection.json
    type: OpenCollection
  description: >-
    The generic DKAN datastore access layer beneath every Open Payments dataset -
    a structured query endpoint (conditions, properties, sorts, limit, offset over
    GET or POST), a SQL query endpoint at /datastore/sql, and CSV/JSON download.
    Works against any distribution by dataset id and index, or directly by
    distribution id.
