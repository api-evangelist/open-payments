aid: open-payments
url: https://raw.githubusercontent.com/api-evangelist/open-payments/refs/heads/main/apis.yml
name: CMS Open Payments
kind: government
description: >-
  CMS Open Payments is the U.S. federal transparency program (run by the Centers
  for Medicare and Medicaid Services) that publishes payments and transfers of
  value made by drug and medical device manufacturers and group purchasing
  organizations to physicians, non-physician practitioners, and teaching
  hospitals. The public data site at openpaymentsdata.cms.gov exposes a free,
  open, no-authentication REST API (a DKAN-style data catalog under /api/1) that
  lets developers query general payments, research payments, and ownership and
  investment records by program year. The API offers a structured datastore query
  interface (filter, select, sort, paginate), a SQL query endpoint, CSV and JSON
  downloads, and a metastore catalog for dataset discovery and metadata. Reads are
  completely free and require no API key. Program Year 2025 alone contains roughly
  17 million published records totaling about 14.67 billion dollars in payments.
