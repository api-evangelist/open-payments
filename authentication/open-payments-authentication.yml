  description: >-
    All public read access to the CMS Open Payments data API is open and requires
    no authentication - no API key, no token, no account. The metastore catalog,
    search, datastore query, SQL, and download endpoints are all reachable
    anonymously over HTTPS. This was confirmed live against the API on the review
    date.
